version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: genmed_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - genmed_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genmed_backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - DB_NAME=genmed_db
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    networks:
      - genmed_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: genmed_frontend
    ports:
      - "5000:5000"
    environment:
      - FASTAPI_BASE_URL=http://backend:8000
      - PORT=5000
    depends_on:
      - backend
    networks:
      - genmed_network

volumes:
  mongo_data:

networks:
  genmed_network:
    driver: bridge
